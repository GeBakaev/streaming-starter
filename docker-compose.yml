services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1 # one partition keeps watermarks simple

  # ---------- v3: the lake ----------
  # SeaweedFS: S3-compatible object storage (stands in for Amazon S3 locally).
  # (MinIO was the first choice, but its images were pulled from Docker Hub and
  # quay.io in 2026.) Local dev mode: S3 API on :8333, no auth.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -s3 -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
    ports:
      - "8333:8333"

  # One-shot helper: object stores don't create buckets on demand, so create `warehouse`.
  s3-init:
    image: amazon/aws-cli
    depends_on:
      - seaweedfs
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1; do sleep 1; done;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://warehouse || true;
      aws --endpoint-url http://seaweedfs:8333 s3 ls;
      "
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-password}
      AWS_REGION: us-east-1

  # Iceberg REST catalog: keeps track of which tables exist and their current snapshot.
  # (Plays the role AWS Glue Data Catalog would in the cloud.)
  iceberg-rest:
    image: apache/iceberg-rest-fixture
    depends_on:
      - s3-init
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-password}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:sqlite:file:/tmp/catalog.db

  # Tools container (not started by default): reads the Iceberg tables back.
  #   docker compose run --rm lake-tools python /work/check_lake.py
  lake-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        RUN pip install --no-cache-dir "pyiceberg[pyarrow,pandas]"
    volumes:
      - ./:/work
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-password}
    depends_on:
      - iceberg-rest

  jobmanager:
    build: .
    image: streaming-starter-flink
    platform: linux/amd64
    ports:
      - "8081:8081"
    command: jobmanager
    depends_on:
      - kafka
      - iceberg-rest
    volumes:
      - ./:/opt/job
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
      # v3: credentials for the S3 store (S3FileIO reads the standard AWS variables)
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-password}
      - AWS_REGION=us-east-1
      # v3: secret key for hashing account_id. Set it in .env (see .env.example).
      - HMAC_KEY=${HMAC_KEY:-local-dev-only-not-a-real-secret}

  taskmanager:
    image: streaming-starter-flink
    platform: linux/amd64
    depends_on:
      - jobmanager
      - kafka
      - iceberg-rest
    command: taskmanager
    volumes:
      - ./:/opt/job
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
      # v3: credentials for the S3 store (S3FileIO reads the standard AWS variables)
      - AWS_ACCESS_KEY_ID=${S3_ACCESS_KEY:-admin}
      - AWS_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-password}
      - AWS_REGION=us-east-1
      # v3: secret key for hashing account_id. Set it in .env (see .env.example).
      - HMAC_KEY=${HMAC_KEY:-local-dev-only-not-a-real-secret}
